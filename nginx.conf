events {}
http {
  # Docker's DNS returns one A record per api replica. "resolve" re-queries it
  # (every 5 s here), so replicas that are recreated with new IPs are picked up.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 64;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
