# Seed limits loaded at startup with SET NX (never overwrites admin changes).
# Production: this would live in Postgres behind an admin API; see DESIGN.md.
default:
  container-tracking: 5000
  sailing-schedule: 10000
orgs:
  count: 200            # generates org-0001 .. org-0200 with the default limits
  overrides:
    org-0001:
      container-tracking: 500
# Optional fixed-window burst limit: at most `units` per `window_s` seconds, on top of
# the monthly limit. Features without an entry have no burst limit.
burst:
  default:
    container-tracking: {units: 300, window_s: 1}
  overrides:
    org-0001:
      container-tracking: {units: 100, window_s: 1}
