name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt

      - name: Pre-commit hooks (whitespace, YAML/TOML, merge markers, secrets)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: black
        run: black --check --diff .

      - name: ruff
        run: ruff check --output-format=github .

      - name: mypy
        # Skipped until the repo contains Python files; mypy exits 2 on an empty tree.
        run: |
          if [ -n "$(git ls-files '*.py')" ]; then mypy .; else echo "No Python files yet"; fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt

      - name: pytest
        # Skipped until tests/ exists; pytest exits 5 when nothing is collected.
        run: |
          if [ -d tests ]; then pytest; else echo "No tests/ directory yet"; fi
